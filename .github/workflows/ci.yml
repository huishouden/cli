name: ci

# main only: tests, then the release (below). No tag moves. Pull requests are verified by their
# author (`hh dev evidence`).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: huishouden/pwa-kit/actions/leak-scan@v0
      - uses: huishouden/pwa-kit/actions/license-check@v0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: ./src/main.ts --help

  # Versioning is CI's, never a commit: the next semver from the Conventional Commit titles since
  # the last v* tag (scripts/next-version.ts; chore/docs/test/ci alone release nothing), an annotated
  # tag, and a GitHub release with generated notes and the tarball `hh self-update` installs.
  # package.json stays 0.0.0; the tarball is packed with the release's version.
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Tag, pack and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          next=$(bun scripts/next-version.ts)
          if [ -n "$next" ]; then
            prev=${next% *}; v=${next#* }; [ "$prev" = "-" ] && prev=""
            if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              echo "v$v already tagged"
            else
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "v$v" -m "v$v"
              git push origin "v$v"
            fi
          else
            # Nothing new to release. A tag whose release failed half-way is finished from the tag.
            prev=""
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$last" ] || gh release view "$last" >/dev/null 2>&1; then echo "nothing to release"; exit 0; fi
            v=${last#v}
            git checkout -q "$last"
            prev=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n 2p)
          fi
          if gh release view "v$v" >/dev/null 2>&1; then echo "release v$v exists"; exit 0; fi
          jq --arg v "$v" '.version = $v' package.json > "$RUNNER_TEMP/package.json"
          cp "$RUNNER_TEMP/package.json" package.json
          bun pm pack --filename "cli-$v.tgz" --quiet
          gh release create "v$v" "cli-$v.tgz" --verify-tag --title "v$v" --generate-notes ${prev:+--notes-start-tag "$prev"}
